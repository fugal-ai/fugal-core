name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Seconds. Syntax, data integrity, and the hygiene gate that keeps this repo public.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: All Python compiles
        run: python -m compileall -q fugal scripts verify tests

      # Milliseconds, no backbone, no network: the wire-shape adapters are pure functions,
      # and they are where a bug does NOT raise — a dropped tool_call_id just hangs a tool
      # loop. numpy is the only dependency reaching them (via router.py).
      - name: Wire-shape adapter tests
        run: |
          pip install -q numpy starlette uvicorn httpx
          python -m unittest discover -s tests -v

      - name: Head properties (pure numpy, no backbone)
        run: python verify/verify_head.py

      - name: Declared version matches the package
        run: |
          python - <<'PY'
          import re, pathlib
          pt = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          ini = pathlib.Path("fugal/__init__.py").read_text(encoding="utf-8")
          a = re.search(r'^version = "([^"]+)"', pt, re.M).group(1)
          b = re.search(r'__version__ = "([^"]+)"', ini).group(1)
          assert a == b, f"pyproject {a} != fugal.__version__ {b}"
          print("version", a)
          PY

      - name: Price sheet is valid JSON and covers the head
        run: |
          python - <<'PY'
          import json, numpy as np
          z = np.load("data/router_head.npz", allow_pickle=False)
          models = [str(m) for m in z["models"]]
          n = len(models)
          assert z["W"].shape == (n, 1024), z["W"].shape
          assert z["b"].shape == (n,)
          v2 = "mean_in_tokens" in z.files
          if v2:  # docs/HEAD_FORMAT.md: routing cost computed from the sheet at load
              assert z["mean_in_tokens"].shape == (n,) and z["mean_out_tokens"].shape == (n,)
          else:
              assert z["mean_cost"].shape == (n,)
          priced = {m["id"] for m in json.load(open("data/models_2026-06.json"))}
          missing = [m for m in models if m not in priced]
          assert not missing, f"no price for {missing}"
          print(f"head OK ({'v2' if v2 else 'v1'}): {n} models, "
                f"lambda={float(z['lam']):g}, all priced")
          PY

      # This repo is the public half of a codebase whose private half runs billing. A
      # string from that half landing here is the one mistake that cannot be undone after
      # a push, so it fails the build rather than waiting for review to catch it.
      - name: No billing, auth, or cascade strings
        run: |
          if git grep -nEi 'supabase|sk-fugal|sk-fugu|credit_micro|bill_margin|ledger|oauth|cascade|escalat|verifier|model_iter_60|fugal-(web|billing)' \
               -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::forbidden string found (see matches above)"
            exit 1
          fi
          echo "clean"

  # Minutes. Proves the product actually routes — a green badge that only ran compileall
  # would be worse than no badge.
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache the backbone
        uses: actions/cache@v6
        with:
          path: artifacts/Qwen3-0.6B
          key: qwen3-0.6b-${{ hashFiles('scripts/fetch_backbone.py') }}

      - name: Install (CPU torch)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers numpy huggingface_hub starlette uvicorn httpx

      - name: Fetch the backbone
        run: python scripts/fetch_backbone.py

      # The product's core promise: one model call per turn, multi-turn included.
      # Mocked worker, so this spends nothing and needs no key.
      - name: Routing is one call per turn
        run: python verify/verify_routing.py

      - name: --route picks a model the head actually scores
        run: |
          python -m fugal --route "what is 15% of 240?" | tee route.txt
          python - <<'PY'
          import numpy as np
          models = {str(m) for m in np.load("data/router_head.npz", allow_pickle=False)["models"]}
          picked = [l.split()[0] for l in open("route.txt") if "<-- WORKER" in l]
          assert len(picked) == 1, f"expected one WORKER line, got {len(picked)}"
          assert picked[0] in models, f"{picked[0]} is not one of the head's models"
          print("routed to", picked[0])
          PY

      - name: The server starts and /v1/route costs nothing
        run: |
          python -m fugal --serve --port 8090 &
          for i in $(seq 1 60); do
            curl -sf localhost:8090/health >/dev/null && break || sleep 2
          done
          curl -sf localhost:8090/health | tee health.json
          curl -sf localhost:8090/v1/models
          curl -sf -X POST localhost:8090/v1/route -H 'Content-Type: application/json' \
               -d '{"query":"reverse a linked list in python"}' | head -c 300
          python -c "import json;h=json.load(open('health.json'));assert h['spend_usd']==0,h"

      # The browser defences, asserted rather than assumed. Both failures are silent: a
      # reflected Origin looks fine until a random web page is spending your credit, and a
      # missing Host check looks fine until DNS rebinding walks straight past same-origin.
      - name: Browsers are locked out by default
        run: |
          python -m fugal --serve --port 8091 &
          for i in $(seq 1 60); do
            curl -sf localhost:8091/health >/dev/null && break || sleep 2
          done

          echo "-- no Access-Control-Allow-Origin is reflected"
          if curl -si localhost:8091/health -H 'Origin: https://evil.example' \
               | grep -i 'access-control-allow-origin'; then
            echo "::error::CORS header sent to an origin that was never allowed"; exit 1
          fi

          echo "-- preflight from an unlisted origin is refused"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
                 localhost:8091/v1/chat/completions -H 'Origin: https://evil.example')
          [ "$code" = "403" ] || { echo "::error::preflight returned $code, want 403"; exit 1; }

          echo "-- a rebound Host is refused"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8091/health \
                 -H 'Host: evil.example')
          [ "$code" = "403" ] || { echo "::error::rebound Host returned $code, want 403"; exit 1; }

          echo "-- localhost still works"
          curl -sf localhost:8091/health >/dev/null

          echo "-- an explicitly allowed origin IS honoured"
          kill %1 || true
          python -m fugal --serve --port 8092 --cors-origin https://good.example &
          for i in $(seq 1 60); do
            curl -sf localhost:8092/health >/dev/null && break || sleep 2
          done
          curl -si localhost:8092/health -H 'Origin: https://good.example' \
            | grep -i 'access-control-allow-origin: https://good.example'
