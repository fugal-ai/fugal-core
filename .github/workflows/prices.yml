name: Price drift

# The price sheet is the one input that goes stale on its own. Billing no longer depends
# on it — the spend caps count what OpenRouter reports it charged for each call — but
# routing estimates (and, with a v2 head, the routing trade-off itself) still do. This
# checks weekly and FAILS when any price moved past refresh_prices.py's tolerance, which
# shows up as a red run and an email; the fix is `python scripts/refresh_prices.py` in a
# normal PR. Deliberately not a bot PR: that needs an org-wide Actions permission and a
# PR the CI workflow would not run on.

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (numpy only — the script reads the head for its model list)
        run: pip install -q numpy
      # Exits 1 on drift or on a model that vanished from OpenRouter; a network failure
      # also exits nonzero — fail loud, not wrong.
      - name: Check for drift
        run: python scripts/refresh_prices.py --check
